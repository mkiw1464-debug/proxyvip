<!-- Modal Register -->
<div class="backdrop-blur-xl bg-white/5 border border-white/10 p-10 rounded-[2rem] shadow-2xl">
  <h2 class="text-3xl font-bold text-white mb-2">Join PROXY VIP</h2>
  <p class="text-gray-400 text-sm mb-8">No Email. Just Username.</p>

  <input type="text" id="regUser" placeholder="Choose Username" class="w-full bg-black/20 border border-white/10 p-4 rounded-2xl mb-4 text-white">
  <input type="password" id="regPass" placeholder="Choose Password" class="w-full bg-black/20 border border-white/10 p-4 rounded-2xl mb-6 text-white">

  <button onclick="register()" class="w-full bg-gradient-to-r from-blue-500 to-purple-600 py-4 rounded-2xl font-bold text-white shadow-lg shadow-blue-500/20">
    CREATE ACCOUNT
  </button>

  <p class="text-[10px] text-red-400 mt-6 uppercase tracking-widest leading-relaxed">
    ⚠️ Warning: Kami tidak simpan email. Sila ingat password anda. <br>Screenshot maklumat akaun anda sekarang!
  </p>
</div>
